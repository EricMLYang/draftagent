# 設計準則 — 手冊（章節待核）
design_criteria:
  source: 桃園市雨水流出抑制設施設計參考手冊（草案）
  url: null
  url_note: 研究文件未記錄手冊 URL，待補
  as_of: "2019-04-01"
  return_period_yr:
    storage: 20       # 貯集設施設計（本 repo 用於溢流堰 Q20 檢核）
    release: 5
    collection: 5     # 集水 / 排水管渠設計
  tc_min_recommended: 5            # 建築基地建議集流時間（min）
  velocity_m_s: [0.8, 3.0]         # 管渠設計流速範圍
  freeboard_u_ditch:               # U 型溝出水高（寬度 ≤ width_max_m 適用）
    width_max_m: 0.60
    ratio_of_depth: 0.30           # 出水高 ≥ 水深 × 0.30
    min_m: 0.20                    # 且 ≥ 0.20 m
  min_pipe_diameter:               # 依集水面積之最小管徑（area_m2_max 為上限含）
    - {area_m2_max: 600,  diameter_min_mm: 150}
    - {area_m2_max: 1000, diameter_min_mm: 200}
  loss_coefficients:
    entrance: 0.5
    exit: 1.0
  # 抽水機起抽後最少連續運轉時間：起抽水位 → 停機水位之間的容量 / 抽水量 ≥ 此值（drainage/hydraulics.py E7）
  # 來源不是設計參考手冊，而是送審檢核表 → 獨立附 source / verified
  pump_min_run_min:
    value: 15
    unit: min
    source: 桃園市雨水下水道相關設施送審案件排水報告內容檢核表（起抽 / 停機水位）
    source_url: "https://sewergis.tycg.gov.tw/Content/雨水申請案/排水報告內容檢核表.odt"
    as_of: null
    verified: false
    note: >-
      15 分鐘由任務說明轉錄；研究文件 §2a 只記錄檢核表要求標示「起抽/停機水位」，
      「起抽後至少運轉 15 分鐘」原文未收錄，待人工開啟檢核表核對。
  note: >-
    出水高「水深 30% 且 ≥ 0.20 m」本 repo 解讀為 freeboard ≥ max(0.30 × 水深, 0.20 m)；
    寬 > 0.60 m 之 U 型溝、集水面積 > 1000 m² 之管徑，手冊規則未收錄 → verifier 僅 WARNING。

# 孔口 / 堰 — 手冊 7.7
# 公式形式寫在 draftagent/hydro/taoyuan.py 的 orifice_q / weir_q docstring
orifice_weir:
  source: 桃園市雨水流出抑制設施設計參考手冊（草案）第 7.7 節
  url: null
  url_note: 研究文件未記錄手冊 URL，待補
  as_of: "2019-04-01"
  rect_orifice_coeff: 2.6563   # Q = k · L · B · (y − L/2)^0.5
  circ_orifice_coeff: 2.0862   # Q = k · L² · (y − L/2)^0.5
  rect_weir_coeff: 1.767       # Q = k · B · y^1.5
  note: >-
    疑點待核：研究彙整另見「孔口流量 Qa = 2.0862 × W × L × (h − L/2)^0.5」寫法（係數 2.0862
    搭配矩形 W×L），與手冊 7.7「圓形孔口 Q = 2.0862 · L² · (y − L/2)^0.5」不一致。
    本檔只收手冊 7.7 版本。三個係數約為 Cd = 0.6 時 0.6·√(2g)、0.6·(π/4)·√(2g)、
    (2/3)·0.6·√(2g) 的數值，可作為人工核對參考。
