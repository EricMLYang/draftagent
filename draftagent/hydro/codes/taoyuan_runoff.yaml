# ------------------------------------------------------------------ 逕流量標準（法規）
runoff_standard:
  source: 桃園市建築基地開發排入雨水下水道逕流量標準（民國 108-09-26）
  url: https://law.tycg.gov.tw/NewsContent.aspx?id=2423
  as_of: "2019-09-26"
  min_storage_m3_per_m2: 0.051        # 最小貯集量 = As × 0.051
  max_release_cms_per_m2: 0.000014    # 最大容許排放量 = As × 0.000014（m³/s）
  design_release_ratio: [0.85, 1.00]  # 設計排放量須介於容許排放量的 85%–100%
  exempt_site_area_m2_max: 300        # 基地面積 ≤ 此值免設
  note: "design_release_ratio 與 exempt_site_area_m2_max 依任務說明轉錄，研究文件未逐字引用條文，待核"

