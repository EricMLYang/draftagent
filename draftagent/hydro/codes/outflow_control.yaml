# ------------------------------------------------------------------ 設計雨量（基準 第五、六點；手冊 4.2、4.3）
design_storm:
  <<: *gazette
  clause: 第五點、第六點；手冊 4.3 說明（一）～（三）
  duration_min: 1440            # 第五點：暴雨量採 24 小時降雨延時總降雨量
  dt_min: 10                    # 第六點：交替區塊法，單位時間刻度 10 分鐘
  horner_form: "I_t^T = a / (t + b)^c；I: mm/hr，t: min；R24 = I_1440^T × 24（mm）"
  method: >-
    手冊 4.3：求各延時（10、20、…、1440 min）降雨強度，乘延時得累積雨量，相減得每單位時間雨量；
    除以總雨量得百分比；最大值置中，依交替區塊法「右大左小」依序排列。
  return_periods_yr: [2, 5, 10]   # 第十二點（一）：開發後 2、5、10 年洪峰 ≤ 開發前
  note: >-
    「置中」位置原文未定義偶數區塊時之索引；本 repo 慣例：n 個區塊時最大值放第 (n−1)//2 個（0 起算），
    之後依序右、左交替，使 144 個區塊恰好排滿。Horner 係數 a、b、c 由工程師依治理規劃報告或
    鄰近氣象局 / 水利署雨量站分析提供（spec.horner），本檔不收各站係數。

# ------------------------------------------------------------------ 有效降雨（基準 第七點；手冊 4.4）
scs_cn:
  <<: *gazette
  clause: 第七點；手冊 4.4
  formula: "Pe = (P − 0.2Y)² / (P + 0.8Y)（P > 0.2Y，否則 Pe = 0）；Y = 25.4 (1000/CN − 10)；P、Pe 為累積量 mm"
  initial_abstraction_ratio: 0.2
  pre_dev_cn_max: 70
  pre_dev_cn_max_source: 出流管制技術手冊 2021 版 4.4 說明（三）「開發前 CN 值大於 70 者，以 70 計」（基準原文無此句）
  note: 基準原文以 Y 表示集水區最大蓄水量（即 SCS 的 S）

