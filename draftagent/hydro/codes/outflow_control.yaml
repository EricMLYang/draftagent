    2:  {name: 耕地-有保護措施, A: 62, B: 78, C: 78, D: 81}
    3:  {name: 牧草地或放牧地-不良情況, A: 68, B: 79, C: 86, D: 89}
    4:  {name: 牧草地或放牧地-良好情況, A: 39, B: 61, C: 74, D: 80}
    5:  {name: 草地-良好情況, A: 30, B: 58, C: 71, D: 78}
    6:  {name: 森林-稀疏、覆蓋少、無覆蓋物, A: 45, B: 66, C: 77, D: 83}
    7:  {name: 森林-良好覆蓋, A: 25, B: 55, C: 70, D: 77}
    8:  {name: 空地公園等-良好情況（草地覆蓋 > 75%）, A: 39, B: 61, C: 74, D: 80}
    9:  {name: 空地公園等-稍好情況（草地覆蓋 50~75%）, A: 49, B: 69, C: 79, D: 84}
    10: {name: 商業區（85% 不透水）, A: 89, B: 92, C: 94, D: 95}
    11: {name: 工業區（72% 不透水）, A: 81, B: 88, C: 91, D: 93}
    12: {name: 住宅-每塊建地 ≦ 506 m²（不透水 65%）, A: 77, B: 85, C: 90, D: 92}
    13: {name: 住宅-每塊建地 ≦ 1012 m²（不透水 38%）, A: 61, B: 75, C: 83, D: 87}
    14: {name: 住宅-每塊建地 ≦ 1349 m²（不透水 30%）, A: 57, B: 72, C: 81, D: 86}
    15: {name: 住宅-每塊建地 ≦ 2024 m²（不透水 25%）, A: 54, B: 70, C: 80, D: 85}
    16: {name: 住宅-每塊建地 ≦ 4047 m²（不透水 20%）, A: 51, B: 68, C: 79, D: 84}
    17: {name: 鋪石（混凝土或柏油）、停車場、屋頂、道路等, A: 98, B: 98, C: 98, D: 98}
    18: {name: 街道, A: 98, B: 98, C: 98, D: 98}
    19: {name: 鋪石道路及雨水下水道, A: 76, B: 85, C: 89, D: 91}
    20: {name: 碎石道路及泥土道路, A: 72, B: 82, C: 87, D: 89}
    21: {name: 水體, A: 98, B: 98, C: 98, D: 98}
  special:   # 基準 附表四
    aquaculture_pond: {name: 水產養殖及蓄水池, cn: 55}
    photovoltaic: {name: 光電設施, cn: 98}
  note: 附表一（土壤分類）、附表三（國土利用分類對應）未轉錄；soil_group 與 SCS 分類由工程師判定

# ------------------------------------------------------------------ 集流時間（基準 第八點）
time_of_concentration:
  <<: *gazette
  clause: 第八點
  tc_min_floor: 10                      # 集流時間小於十分鐘者，以十分鐘計
  overland_formula: "T1 = L^0.8 (Y + 25.4)^0.7 / (4238 H^0.5)；T1 hr，L m，Y mm，H 地表平均坡度 %"
  inlet_time_min:                        # 第八點（二）：經側溝 / 下水道者之流入時間（範圍，由工程師取值）
    gutter_and_inlet: [5, 10]            # 側溝及雨水井
    storm_sewer_trunk: [10, 15]          # 雨水下水道幹支線系統
  channel_formula: "T2 = L / (3600 V)；V = (1/n) R^(2/3) S^(1/2)"

# ------------------------------------------------------------------ SCS 無因次單位歷線（基準 第九點、附表五；手冊 表 4-5）
scs_unit_hydrograph:
  <<: *gazette
  clause: 第九點、附表五；手冊 4.6 式 4-10～4-12、表 4-5（資料來源 NRCS NEH Part 630）
  formula: "Tp = tr/2 + Tlag；Tlag = 0.6 Tc；Qp = 0.208 A Re / Tp（A km²，Re mm，Tp hr，Qp m³/s）"
  peak_factor: 0.208
  lag_ratio: 0.6
  # [t/Tp, Q/Qp]，33 點
  table:
    - [0.0, 0.000]
    - [0.1, 0.030]
    - [0.2, 0.100]
    - [0.3, 0.190]
    - [0.4, 0.310]
    - [0.5, 0.470]
    - [0.6, 0.660]
    - [0.7, 0.820]
    - [0.8, 0.930]
    - [0.9, 0.990]
    - [1.0, 1.000]
    - [1.1, 0.990]
    - [1.2, 0.930]
    - [1.3, 0.860]
    - [1.4, 0.780]
    - [1.5, 0.680]
    - [1.6, 0.560]
    - [1.7, 0.460]
    - [1.8, 0.390]
    - [1.9, 0.330]
    - [2.0, 0.280]
    - [2.2, 0.207]
    - [2.4, 0.147]
    - [2.6, 0.107]
    - [2.8, 0.077]
    - [3.0, 0.055]
    - [3.2, 0.040]
    - [3.4, 0.029]
    - [3.6, 0.021]
    - [3.8, 0.015]
    - [4.0, 0.011]
    - [4.5, 0.005]
    - [5.0, 0.000]
  note: >-
    依表線性內插取各時刻縱距。離散化後單位歷線體積與 1 mm × A 之差異，本 repo 慣例以比例校正至
    恰為 1 mm × A，並在結果中回報校正前比值（非法規規定）。

# ------------------------------------------------------------------ 外水位歷線（基準 第十點；手冊 4.7）
tailwater:
  <<: *gazette
  clause: 第十點；手冊 4.7 式 4-12、4-13
  formula: "hp = Hp − Hb；Ht = (1/4) hp + (3/4)(Qt/Qp) hp + Hb；Qt、Qp 為滯洪池入流歷線"
  coef_base: 0.25
  coef_ratio: 0.75
  sewer_hp_ratio: 0.8
  sewer_hp_note: >-
    手冊 4.7：聯外排水路屬雨水下水道、道路側溝或其他水路者，經審查同意後可採箱涵高 / 側溝深或
    管涵直徑的 0.8 倍為 hp（本 repo 只記錄，不自動套用）

# ------------------------------------------------------------------ 檢核基準（基準 第十二～十四點；手冊 6.1、6.2）
peak_criterion:
  <<: *gazette
  clause: 第十二點（一）
  rule: 開發後排水出流 2、5、10 年重現期距洪峰流量依序分別不大於開發前 2、5、10 年洪峰流量
  return_periods_yr: [2, 5, 10]
  note: 手冊 6.2（一）2：聯外排水路通洪能力僅 5 年者另有規則（5、10 年不大於開發前 5 年），本模組未實作

detention:
  <<: *gazette
  clause: 第十三點
  design_return_period_yr: 10          # 第十三點（一）：依開發後 10 年洪水歷線、出流管制設施及外水位歷線演算
  safety_factor_min: 1.2               # 第十三點（二）：安全係數應為 1.2 以上（主管機關得提高）
  freeboard_m: null
  freeboard_note: 基準、手冊皆未查到滯洪池出水高數值 → verifier 只 WARNING（spec 可由工程師給值檢核）

simple_check:
  <<: *gazette
  clause: 第十四點；手冊 6.1（二）、6.2（二）
  max_area_ha: 5                       # （一）土地開發利用面積五公頃以下
  conditions:
    - 聯外排水路通洪能力達十年重現期距洪峰流量
    - 滯洪體積之安全係數為一點二
    - 開發基地排水出流為重力排水
  volume_m3_per_ha: 520                # 每公頃滯洪體積不小於 520 m³
  q10_cms_per_ha: 0.16                 # 每公頃排水出流十年洪峰流量不大於 0.16 m³/s
  note: >-
    第十四點將「安全係數為一點二」列為適用條件之一，520 m³/ha 是否已含 1.2 原文未明，
    本 repo 不再乘 1.2，verifier 以 WARNING 提醒待核。手冊 6.1（二）另建議集水面積改變者改用詳細演算。

# ------------------------------------------------------------------ 出流工水理（手冊 附件一 附 1.2、附 1.3）
hydraulics:
  <<: *manual
  clause: 附件一 附 1.2（孔口、溢流堰）、附 1.3（H-A-V）
  g: 9.81                              # 附 1.2 垂直孔口：重力加速度 9.81 m/s²
  orifice_cd_default: 0.61             # C0 = 0.61～0.64，一般取 0.61
  orifice_cd_range: [0.61, 0.64]
  horizontal_orifice_weir_cw: 1.7      # 水平孔口小水頭時之堰流係數 Cw = 1.7（式 1-2，Q = Cw Pe he^1.5）
  vertical_orifice: "Q = C0 A0 √(2gZ)；自由流 Z = H（至孔口中心之水頭），潛沒流 Z = 上下游水位差（式 1-6）"
  horizontal_orifice: "Qw = Cw Pe he^1.5、Q0 = n C0 A0 √(2g he)，取小者（式 1-2～1-5）"
  weir: "Q = Cd (2/3) √(2g) L H1^1.5（寬頂堰及銳緣堰自由流，式 1-8）"
  weir_cd:                             # 式 1-9～1-12，H1 堰前水深，BW 堰頂寬（順流向），P1 堰高
    long:          {range: "H1/BW ≦ 0.1",        formula: "Cd = 0.561 (H1/BW)^0.022"}
    broad_crested: {range: "0.1 ≦ H1/BW ≦ 0.35", formula: "Cd = 0.028 (H1/BW) + 0.521"}
    narrow:        {range: "0.35 ≦ H1/BW ≦ 1.5", formula: "Cd = 0.120 (H1/BW) + 0.492"}
    sharp:         {range: "H1/BW > 1.5",        formula: "Cd = 0.08 (H1/P1) + 0.611"}
  hav_layer_formula: "Vn = (H_{n+1} − H_n)(A_n + A_{n+1} + √(A_n A_{n+1})) / 3"
  models: 滯洪體積演算可利用 HEC-RAS、SWMM（Ver 5.1 以後）或 SOBEK；模式輸入檔與輸出檔應附於報告書附錄
  note: >-
    未收錄：潛沒堰折減係數（附圖 1-5 查圖）、Ogee 堰係數（附圖 1-3 查圖）。
    本 repo 慣例（非手冊）：垂直孔口水位未淹過孔口頂時以 Q_full(h=D) × (h/D)^1.5 接續、避免不連續；
    外水位 ≥ 池水位時不倒灌（Q = 0，假設設有防倒灌）。堰在外水位高於堰頂時未折減 → verifier WARNING。

# ------------------------------------------------------------------ 適用門檻（114-09-03 修正辦法）
applicability:
  source: 出流管制計畫書與規劃書審核監督及免辦認定辦法（114-09-03 修正）
  url: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0110108
  as_of: "2025-09-03"
  general_threshold_ha: 1.0              # 第 2 條第 1 項：所列開發樣態，面積達一公頃以上
  urban_new_building_threshold_ha: 0.2   # 第 2-1 條第 1 項：新建造建築物且基地全部位於都市計畫區內，達 0.2 ha 以上
  urban_exempt_below_ha: 1.0             # 第 2-1 條第 2 項：未達一公頃且辦理下列之一者得免提計畫書
  exempt_options:
    outflow_suppression: 規劃雨水流出抑制措施且出流量符合該措施設置規範，建照核發前送直轄市、縣（市）主管機關備查
    retention: 規劃雨水貯滯（留）措施，每公頃容量不小於 675 m³，建照核發前送直轄市、縣（市）主管機關備查
  retention_m3_per_ha: 675
  note: >-
    第 2 條另有「未增加逕流量經技師簽證免提」、逕流分擔行政契約等例外，本模組不判定。
    第 2 條各開發樣態（住宅社區、開發可建築用地等）是否適用由工程師 / 使用者判定。
