[project]
name = "draftagent"
version = "0.0.1"
description = "Agent-operable CAD drafting for Taiwan land development, urban renewal, cadastral and hydraulic planning documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "numpy>=1.26",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "networkx>=3.2",      # 排水網路拓樸（迴圈、出流口、上游累加）
  "pint>=0.23",         # 帶單位數值，擋 m/mm、ha/m² 混用
  "matplotlib>=3.8",    # DXF → PNG/PDF 預覽（ezdxf drawing addon）
  "typer>=0.12",        # 統一 CLI：draftagent build / verify / preview
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8"]
report = ["python-docx>=1.1"]   # 排水計畫書 report.docx
hydro = ["pyswmm", "swmm-toolkit"]
solid = ["smlibpy"]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6", "pytest-xdist>=3"]

[project.scripts]
draftagent = "draftagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["draftagent"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["work", "runs"]  # agent 暫存 spec 與 build 產物

[tool.ruff.lint]
# 規則集：pycodestyle(E/W)、pyflakes(F)、isort(I)、bugbear(B)、pyupgrade(UP)、ruff(RUF)、
# pylint(PL)、blind-except(BLE)、comprehensions(C4)、pie(PIE)、debugger(T10)、
# executable(EXE)、pygrep-hooks(PGH)、tidy-imports(TID)
select = ["E", "F", "W", "I", "B", "UP", "RUF", "PL", "BLE", "C4", "PIE", "T10", "EXE", "PGH", "TID"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # 全形中文標點（，：（）×−）是刻意的，不是誤植
  "E501",                        # 行長交給 formatter；中文字串常超過
  "E741", "E743",                # I / O / l 是水文公式符號（I 雨強、O 出流）
  "RUF007",                      # zip(a, a[1:]) vs itertools.pairwise：風格，不擋
  "RUF046",                      # int(round(x)) / int(math.ceil(x))：風格，不擋
  "RUF059",                      # 解包後未用的變數（x0_, y0_ = bounds）：可讀性取捨
  "PLW2901",                     # 迴圈變數重新賦值（g, c = _val(g), _val(c)）：常見正規化寫法
  "PLW1510",                     # subprocess.run 未給 check：呼叫端自行檢查 returncode
  "PLW3301",                     # min(min(a), b)：風格
  "RUF005",                      # [*a, b] vs a + [b] 純風格
  "PLR2004",                     # magic number：工程常數到處都是，強制具名反而難讀
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # 複雜度門檻：verifier 天生長
  "PLC0415",                     # 函式內 import：選用相依（matplotlib / ifcopenshell）刻意延遲載入
]

[tool.ruff.lint.per-file-ignores]
"draftagent/__init__.py" = ["PLE0604"]          # __all__ = [..., *_LAZY]：誤判
"draftagent/hydro/taoyuan_report.py" = ["E731"]
"draftagent/schema/drainage.py" = ["PLR5501"]

[tool.ruff.lint.isort]
known-first-party = ["draftagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: 執行時間長的測試（可用 -m 'not slow' 略過）",
  "swmm: 需要 pyswmm / swmm-toolkit（.[hydro]）",
  "visual: 產 PNG 預覽並需要 CJK 字型；Linux 無中文字型時自動 skip",
]
